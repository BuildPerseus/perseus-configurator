<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build your Perseus</title>
<meta name="description" content="Pick what you want your home server to do. Get a recommended build, a DIY parts total and a done-for-you price.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(90% 60% at 80% 0%,#14241b 0%,var(--bg) 60%) fixed}
main{flex:1}
.prog{max-width:1000px;margin:0 auto;padding:22px max(5vw,16px) 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.prog div{display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--dim)}
.prog i{display:block;height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.prog .on{color:var(--ink)}.prog .on i{background:var(--glow)}
.stage{max-width:1000px;margin:0 auto;padding:36px max(5vw,16px) 120px}
.stage h1{font-size:clamp(30px,4.4vw,46px);margin-bottom:8px}
.stage .lede{margin-bottom:28px}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pk{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;padding:20px 18px;min-height:150px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.pk:hover{border-color:var(--green-hi);transform:translateY(-2px)}
.pk svg{width:34px;height:34px;color:var(--glow)}
.pk b{font-family:var(--f-head);font-size:18px;font-weight:600;line-height:1.2}
.pk span{font-size:14px;color:var(--muted);line-height:1.45}
.pk[aria-pressed=true]{border-color:var(--glow);background:linear-gradient(180deg,rgba(46,107,74,.35),rgba(46,107,74,.12))}
.pk[aria-pressed=true]::after{content:"✓";position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--glow);color:#0b0f0d;font-weight:700;display:grid;place-items:center;font-size:14px}
.picks.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,15,13,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .in{max-width:1000px;margin:0 auto;padding:12px max(5vw,16px);display:flex;align-items:center;gap:12px}
.bar .info{flex:1;font-size:14px;color:var(--muted)}
.bar .info b{color:var(--ink);font-family:var(--f-head);font-size:18px}
.reveal{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:start}
.rig{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mod{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;opacity:0;animation:pop .45s ease forwards}
.mod svg{width:26px;height:26px;color:var(--glow)}
.mod b{font-size:14px}.mod span{font-size:12.5px;color:var(--dim);line-height:1.35}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none;box-shadow:0 0 0 1px rgba(95,191,134,.25),0 8px 24px -12px rgba(95,191,134,.5)}}
@media (prefers-reduced-motion:reduce){.mod{opacity:1}}
.figs{display:flex;flex-direction:column;gap:10px}
.fig2{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.fig2 span{color:var(--muted);font-size:14.5px}
.fig2 b{font-family:var(--f-head);font-size:26px;font-weight:600;white-space:nowrap}
.fig2.hi{border-color:var(--green)}
.does{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.does span{font-size:14px;border:1px solid rgba(95,191,134,.35);color:var(--green-ink);border-radius:999px;padding:5px 12px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 14.5px var(--f-body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.custom{margin-top:26px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.custom summary{cursor:pointer;padding:16px 18px;font-family:var(--f-head);font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;min-height:56px}
.custom summary::after{content:"+";color:var(--green-ink);font-size:22px}
.custom[open] summary::after{content:"–"}
.custom .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.switch{display:inline-flex;flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--muted);cursor:pointer;min-height:44px}
.switch input{width:20px;height:20px;min-height:0;accent-color:var(--green-hi)}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row .grp{font-size:13px;color:var(--dim)}
.row select{min-height:42px;padding:8px 10px;font-size:15px}
.row .right{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:36px;height:36px;border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer;border-radius:999px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:18px}
.x:hover{color:var(--bad);border-color:var(--bad)}
.meta{grid-column:2/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.spec{grid-column:2/-1;font-size:14px;color:var(--dim)}
.add{display:flex;gap:10px}.add select{flex:1}
.warn{border:1px solid rgba(226,184,92,.45);background:rgba(226,184,92,.08);color:#f0d9a4;border-radius:10px;padding:10px 14px;font-size:14.5px}
.warn.bad{border-color:rgba(238,138,127,.5);background:rgba(238,138,127,.08);color:#f6c3bc}
.warn.info{border-color:var(--line);background:var(--panel2);color:var(--muted)}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.ways .pk{min-height:190px}
.ways .pk em{font-style:normal;font-family:var(--f-head);font-size:22px;color:var(--ink);margin-top:auto}
textarea.copy{font-size:13px;min-height:160px}
@media (max-width:860px){.picks,.picks.five{grid-template-columns:repeat(2,minmax(0,1fr))}.reveal{grid-template-columns:minmax(0,1fr)}.ways{grid-template-columns:minmax(0,1fr)}.ways .pk{min-height:0}}
@media (max-width:560px){.prog span{display:none}.rig{grid-template-columns:repeat(2,minmax(0,1fr))}.pk{min-height:0;padding:16px 14px}.row{grid-template-columns:minmax(0,1fr) auto}.row .grp,.meta,.spec{grid-column:1/-1}}
</style>
</head>
